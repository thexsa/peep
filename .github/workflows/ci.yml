name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  cross-compile:
    name: Cross-Compile Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Validate POSIX install.sh syntax
        run: sh -n install.sh

      - name: Build all supported OS/Arch targets
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64   go build -ldflags="-s -w" -o dist/peep-darwin-arm64       ./cmd/peep
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64   go build -ldflags="-s -w" -o dist/peep-darwin-amd64       ./cmd/peep
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64   go build -ldflags="-s -w" -o dist/peep-linux-amd64        ./cmd/peep
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64   go build -ldflags="-s -w" -o dist/peep-linux-arm64        ./cmd/peep
          CGO_ENABLED=0 GOOS=linux   GOARCH=ppc64le go build -ldflags="-s -w" -o dist/peep-linux-ppc64le      ./cmd/peep
          CGO_ENABLED=0 GOOS=aix     GOARCH=ppc64   go build                  -o dist/peep-aix-ppc64          ./cmd/peep
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64   go build -ldflags="-s -w" -o dist/peep-windows-amd64.exe  ./cmd/peep
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64   go build -ldflags="-s -w" -o dist/peep-windows-arm64.exe  ./cmd/peep
          CGO_ENABLED=0 GOOS=freebsd GOARCH=amd64   go build -ldflags="-s -w" -o dist/peep-freebsd-amd64      ./cmd/peep
